name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.10.1 asyncssh==2.24.0 ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
