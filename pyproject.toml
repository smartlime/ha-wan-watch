[project]
name = "ha-wan-watch"
version = "0.2.0"
description = "Independent multi-router internet availability and quality monitoring for Home Assistant"
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
